# Signed-out clean-build smoke for PidgeonHealth/docs (release policy § 5: "Node 22, Mintlify,
# navigation, search, and link checks pass").
#
# Builds from a fresh anonymous clone only — no local-only content, no monorepo path.

name: clean-build-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  anonymous-clone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Mintlify CLI
        run: npm install --global mintlify

      - name: Build
        run: mintlify build

      - name: Broken-link check
        run: mintlify broken-links

      - name: Navigation / search validity
        run: mintlify validate --if-present
